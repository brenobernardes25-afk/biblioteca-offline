name: Portabilidade do computador
on:
  push:
    paths: ['computador/**', 'tests/**', '.github/workflows/portabilidade.yml']
  pull_request:
    paths: ['computador/**', 'tests/**', '.github/workflows/portabilidade.yml']
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -v
      - run: bash -n computador/INSTALAR_MAC.sh computador/ABRIR_MAC.sh
